# Builds the documentation site with the strict mkdocs build and publishes
# it with GitHub Pages at https://k-kammler.github.io/testuary/.
# The build reads the package's source statically (mkdocs.yml, paths: [src]),
# so it installs only the documentation tools, the docs extra of
# pyproject.toml, and not Testuary or LangAdapter.
name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the documentation tools
        # The same ranges as pyproject.toml's docs extra.
        run: >-
          python -m pip install
          "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10"
          "mkdocstrings[python]>=0.26,<1" "pymdown-extensions>=10,<12"
      - name: Build the site
        run: python -m mkdocs build --strict --site-dir site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
