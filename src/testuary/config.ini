# Bundled defaults. The global config.ini in the user's Testuary directory (or
# an explicit configuration file in its place) overrides these values, the
# project's settings file .testuary/project.ini overrides that, and the
# environment and the command line override both.
# Keep credentials in an untracked models.ini or in environment variables.
# testuary setup model writes models.ini, and testuary init copies a template.

# The model settings: the model a run uses.
[api]
# A model alias of models.ini, or a model name the provider below serves.
# testuary setup project writes the project's model into its
# .testuary/project.ini. A run that selects no model in any layer is
# refused before any work. At the terminal, --model overrides it.
model =
# The provider of a model name that is no alias: openai, ollama, vllm or a
# provider section of models.ini. An alias names its own provider.
provider =

# OpenAI-compatible endpoint defaults. Per-model settings can override them.
[openai]
# The endpoint of the openai provider.
api_url = https://api.openai.com/v1

# Ollama endpoint defaults. Keep the provider credential outside this file.
[ollama]
# The endpoint of the ollama provider: Ollama Cloud by default. An Ollama
# on this machine is http://localhost:11434/v1.
api_url = https://ollama.com/v1

# Local OpenAI-compatible endpoint defaults.
[vllm]
# The endpoint of the vllm provider.
api_url = http://localhost:8000/v1

# Shared execution, context and end-of-phase settings.
[main]
# A prompt profile file, which appends to, replaces or removes parts of the
# bundled prompts (the prompt profile guide describes it). Empty uses the
# bundled prompts.
prompt_profile =
# The base of the starter suites' sampling seeds, unless [starter] seed_base
# sets one. The configuration guide gives the formula.
# The coverage and mutation phases send a seed only when [api], [coverage] or
# [mutation] sets one.
seed = 0
# When the coverage and mutation phases rebuild the conversation they send:
# mode_change rebuilds when the agent's set of available tools changes (for
# example from editing to measuring) and keeps the rebuilt conversation in
# between. every_turn rebuilds on every turn. A rebuild keeps the task prompt
# and the most recent messages ([limits] history_messages) and drops earlier
# reasoning text.
context_rebuild = mode_change
# Rebuild also when the conversation reaches this many estimated tokens while
# the tool set stays the same. Zero disables it.
context_rebuild_trigger_tokens = 0
# At the phase ends of the starter and coverage phases, also measure mutation
# over the full catalogue, so that suite reduction keeps every mutant kill. The
# mutation phase's phase end measures mutation either way.
phase_end_mutation = true
# How the reduced suite's mutation score is obtained: derive restricts the
# merged suite's kill matrix (which test kills which mutant) to the kept
# tests, measure measures the reduced suite again, both uses the new
# measurement and records the derived score as a cross-check. Choosing a
# suite still requires passing tests and complete measurements. Finishing
# reports no derived score: it measures a delivered suite whose score was
# derived.
reduced_suite_mutation = both
# Whether runs get their own directory for the temporary work tree. never: no
# own directory. auto: one only when TESTUARY_MAIN_WORK_DIR_NAMESPACE or
# TESTUARY_EXECUTION_ID names it. always: also without them, named after
# the process and device_name. Use it when several runs share one run
# directory. Result and log directories are not separated by this.
work_dir_job_namespace = auto
# A name for this computer in the records, which label the clock their
# times come from (clock_domain_id), and in the work directory of always above.
# Empty: the computer's own name appears in no result.
# TESTUARY_CLOCK_DOMAIN_ID replaces the whole clock label.
device_name =
# local runs the project's tests with its interpreter on this machine.
# container runs them in a running container, which TESTUARY_PROJECT_CONTAINER
# names.
project_exec = local
# auto uses the target project's pytest configuration when present. An explicit
# path selects a configuration file, and none selects pytest defaults.
pytest_config = auto
# Refuse the run, rather than warn, when a target of a project that is
# a Git checkout differs from the file at its HEAD.
strict_canonical_git = false
# The hints file, relative to the project directory. Empty uses no hints. The
# hints guide says when a file is optional and what refuses a run.
hints_file = hints.json
# Extensions, a comma list of Python files and installed modules, such as
# my_hints.py or my_tool.extension. A run, the tool check (testuary check
# --verify), testuary provision and testuary-web load them at their start,
# each file once. The quick check loads none, and a change of this setting
# loads nothing. Unlike other settings, each layer adds its items to those
# of the earlier layers: the global configuration or the --config files,
# then project.ini, then the environment, then a program's overrides. A
# file is relative to the directory of the settings file that names it, or
# to the project directory for the environment and overrides.
extensions =
# The project's Testuary directory, relative to the project directory: it holds
# the project's settings file project.ini and its results. A run finds the
# project from the directory it starts in upward, as the nearest directory
# holding it. Set it in the global configuration, a file given with --config or
# the environment, never in project.ini.
testuary_dir = .testuary

# The project a run uses. The project's settings file .testuary/project.ini
# usually holds this section, and command-line options override it.
[project]
# The project's name in results and records (${project}). Empty uses the
# source directory's name. At the terminal, --project-name overrides it.
name =
# The source directory, whose files are tested. Empty: the project directory.
source_dir =
# The source files a run without named targets runs, separated by commas,
# relative to the source directory. At the terminal, testuary FILES and
# --source-files name others.
source_files =
# The project's language. A target named on the command line must be
# written in it. Empty accepts the targets of every installed language.
language =
# Time limit, in seconds, for the whole check of the project's tools
# (interpreter, test tools, JDK, build tool). It does not limit generation
# or measurements.
setup_timeout_seconds = 120
# Time limit, in seconds, for each single probe of that check, within the
# remaining total.
setup_probe_timeout_seconds = 10
# The name of this project's entries in the hints file's per_profile
# section. Empty: none.
hint_profile =
# The directory below the source directory from which its Python package is
# imported, for example src. Empty imports from the source directory itself.
python_import_root =
# Variables the processes of the Python adapter's own runs get, as NAME=value
# words, for example PURE_PYTHON=1. Python tests of a C extension do not get
# them.
python_test_environment =
# The project's Python interpreter. Empty: the environment uv provisions
# for python_version, else the project's only environment, its .venv or the
# one activated in the shell. The environment Testuary runs in counts only
# inside the project. Two environments, or none, refuse the run.
python_executable =
# A Python version, for example 3.12, for which uv provisions an environment
# when python_executable is empty.
python_version =
# Requirements file for the environment provisioned by python_version.
requirements =
# A Java project's JDK: its home or its java executable. Blank uses JAVA_HOME,
# except in a container, where it must be named.
java_home =
# The JDK the build tool runs on when it needs a newer Java than the project's
# (Gradle 9 runs on Java 17 or newer). Blank uses java_home.
build_java_home =
# The Maven launcher when the project has no Maven wrapper. Blank uses mvn on
# the path.
maven =
# The Gradle launcher when the project has no Gradle wrapper. Blank uses gradle
# on the path.
gradle =
# The language version the prompts tell the model, for example "Python
# 3.10.15". Empty: the version of the interpreter that runs the tests.
runtime_version =
# unfreeze runs the project's Python with -X frozen_modules=off, so coverage
# and mutation treat the standard library's frozen modules as ordinary files.
# skip leaves them frozen.
frozen_module_strategy = unfreeze
# The run directory. Empty uses results/<model> in the project's Testuary
# directory. A relative path resolves from the project directory. The ${model}
# and ${project} placeholders are filled with file-name-safe values. At the
# terminal, --output-dir overrides it.
output_dir =

# The starter phase: generating and repairing the starter suites, and the
# phase end.
[starter]
# How each accepted starter suite's mutation score is obtained: measure,
# derive or both. The explanation page Measurement and recovery describes each
# method and what a derived score can get wrong.
suite_mutation = measure
# Requested number of independent starter suites, at most 1000.
suite_count = 10
# Generate a failed starter suite again, for example after a reply without a
# test suite, within that suite's own attempts. This does not guarantee
# suite_count usable suites when the attempts run out. Off, each starter
# suite has one attempt.
refill_failed_suites = true
# Generation attempts per starter suite, the first included. It applies only
# while refill_failed_suites is on. A suite does not borrow attempts from
# another.
attempts_per_suite = 4
# Reuse the starter suites an earlier run in this run directory saved, checked
# again before use. A missing or empty one is generated again, which sends
# model requests, and without saved suites every one is. The phase end
# combines them again. At the terminal, --reuse starter instead takes the
# starter phase's saved result as it is.
reuse_suites = false
# Send the first request alone before the remaining concurrent work.
# Provider prefix-cache behavior depends on the endpoint.
cache_warmup = true
# Sampling temperature. A blank value omits it from generation requests.
# Each request carries its own seed from seed_base, which this section may
# set and which defaults to [main] seed. The configuration guide gives the
# formula.
temperature =
# Abandon a streamed generation that produces no answer content within this
# many seconds. Zero disables this content-aware timeout.
reasoning_grace_seconds = 0
# Optional on/off control. Empty leaves the provider's reasoning default.
# OpenAI-compatible endpoints need a declared reasoning_dialect. An off
# control cannot be combined with a reasoning effort or token budget.
reasoning =
# The most starter suite requests sent at the same time.
concurrent_requests = 10
# The most starter suite requests sent at the same time with the ollama
# provider (Ollama Cloud or an Ollama on this machine), in place of
# concurrent_requests.
concurrent_requests_ollama = 4
# Wall-clock limit for a suite execution, in seconds.
suite_run_timeout_seconds = 600
# Count an otherwise passing run as failing when it warns of an asynchronous
# test that did not run properly, such as an unawaited coroutine.
reject_unsound_async_green = true
# How many times a starter suite with failing tests has them removed and runs
# again before it is generated anew. On the suite's last attempt this goes on
# while each round removes at least one more failing test. The same number
# bounds, for each suite at each place, how often a coverage run or mutation
# measurement that fails the suite after its passing normal run has the tests
# it names removed before the suite is measured again. The explanation page
# Measurement and recovery names the places.
failing_test_cleanup_rounds = 3
# Suite reduction: at a phase end, Testuary drops the tests that add no
# coverage and no mutant kill, keeping the fastest set. exact finds that set
# with PuLP's CBC solver and requires a proven optimum. greedy is a heuristic you can
# select instead.
reduction_solver = exact
# Time limit of the exact solver, in seconds, for all its steps together.
reduction_solver_time_limit_seconds = 120
# The smallest run time counted for one test in suite reduction, in
# milliseconds.
reduction_min_test_time_ms = 0.001
# The solver's seed (CBC), separate from the starter suites' seeds.
reduction_solver_random_seed = 1
# Among sets of tests with the optimal run time and test count: name_order
# counts exact duplicate tests once, prefers tests earlier in name order and
# proves the choice unique. solver keeps whichever optimal set CBC returns,
# which can differ between its builds.
reduction_tie_break = name_order
# The most tokens one model response of this phase may have. When the model's
# alias also sets a positive limit, the smaller one applies. Zero sets no
# limit here.
max_output_tokens = 0
# Temporary failures of one starter suite request in a row before the phase
# ends. The configuration guide says which failures are temporary and how
# they are retried.
max_consecutive_transient_failures = 10
# Temporary failures in the whole phase before it ends. Zero disables it.
max_transient_failures_per_phase = 100
# Wait before the first retry without a provider hint, in seconds. It
# doubles per failure up to the maximum.
transient_first_wait_seconds = 10
# The longest such wait, in seconds.
max_transient_wait_seconds = 60
# The longest wait a provider's Retry-After hint may ask for, in seconds.
max_transient_hint_seconds = 3600

# Coverage phase settings. The mutation phase inherits every key its own
# section does not set.
[coverage]
# Send the model's reasoning back with the conversation when the service
# returns it in a separate field (the names below). It uses private
# langchain-openai methods, which a later version may change.
preserve_reasoning_content = true
# The response fields that carry the reasoning, sent back when present.
reasoning_field_names = reasoning_content, reasoning_details, thinking
# Write per-request, tool-selection, final answer check, recovery and
# reasoning events.
enable_trace_log = false
# Time limit, in seconds, for one model request of the coverage phase, and of
# the mutation phase unless [mutation] sets its own. A provider section,
# a models.ini alias or [api] can set it for every phase, and a phase section
# of the same file wins over them. The starter suites' requests use 600 unless
# [starter], [api], a provider section or the alias sets it.
request_timeout_seconds = 3600
# Temporary failures of one request in a row before the phase ends. The
# configuration guide says which failures are temporary and how they are
# retried.
max_consecutive_transient_failures = 10
# Temporary failures in the whole phase before it ends. Zero disables it.
max_transient_failures_per_phase = 100
# Wait before the first retry without a provider hint, in seconds. It
# doubles per failure up to the maximum.
transient_first_wait_seconds = 10
# The longest such wait, in seconds.
max_transient_wait_seconds = 60
# The longest wait a provider's Retry-After hint may ask for, in seconds.
max_transient_hint_seconds = 3600
# Count every retry of a failed model request against
# max_requests_per_phase.
count_retries = false
# When a phase ends with exactly the suite it started with, measured the same
# way and with complete measurements on record, it reuses those measurements
# instead of measuring, reducing and choosing again. False measures, reduces
# and chooses again.
phase_end_evidence_reuse = true
# Ask the model, in the loops' hard rules, to replace a built-in function
# only in the module under test and to simulate a missing package through
# sys.modules. Guidance only: no test is rejected for ignoring it. False
# leaves this guidance out of the prompts.
builtin_replacement_guidance = true
# Wall-clock limit for a suite execution, in seconds.
suite_run_timeout_seconds = 600
# Suite timeouts in a row before the phase ends. A passing run resets the
# count.
# Nonpositive values disable this stop.
suite_timeout_stop_after = 10
# Count an otherwise passing run as failing when it warns of an asynchronous
# test that did not run properly, such as an unawaited coroutine.
reject_unsound_async_green = true
# After a passing test run, also run the file as delivered in reverse order,
# for a language that offers that order, and tell the model which tests fail
# there. The note decides no test's outcome, but while tests fail when run in
# reverse order, the loop does not end at its goal.
report_reverse_order_failures = false
# Attempts of the loop per phase, the first included, used up by rejected
# final answers and by reruns after a temporary failure inside the loop, such
# as a tool that raised. Each rejected final answer counts as a model request.
# Retries of a model request are separate (the settings above). unlimited ends
# the attempts only at a failure that is not retried or at a limit.
max_loop_attempts = 100
# The most model requests this phase may send, a positive number or
# unlimited. A request whose answer is refused counts. Retries after a
# temporary failure count only with count_retries.
max_requests_per_phase = 1000
# The most input tokens all of this phase's requests may have together. Zero
# or unlimited disables this limit.
max_input_tokens_per_phase = 0
# The most output tokens all of this phase's responses may have together.
# Zero or unlimited disables this limit.
max_output_tokens_per_phase = 0
# The most input and output tokens together in this phase. Zero or unlimited
# disables this limit.
max_total_tokens_per_phase = 0
# The longest time this phase may take, in seconds. Zero or unlimited
# disables this limit.
max_wall_clock_seconds_per_phase = 0
# Coverage goal in percent, by goal_metric. The loop ends once it is reached
# (see extra_measurements_after_goal), but not while tests fail when run in
# reverse order (report_reverse_order_failures).
goal = 90
# A final score below this is marked below its minimum in tests.csv. While
# the best score is below it, any rise counts as an improvement.
# complete_tests_below_minimum decides whether the later phases run after it
# is missed. Zero disables the minimum.
minimum = 75
# Run the later phases after a phase misses its minimum score. If false, they
# are skipped. Finishing still records the result.
complete_tests_below_minimum = true
# line or branch selects that coverage score. both uses the lower of line
# and branch coverage, so both must reach the goal, and either the higher one.
# The best passing suite and the measurements without improvement use this
# score.
goal_metric = branch
# Measurements without improvement after which the loop stops. Nonpositive
# values disable this stop. A share such as 10% is that share of this phase's
# max_requests_per_phase, rounded up, and is refused while
# max_requests_per_phase is unlimited.
max_measurements_without_improvement = 10
# Times in a row the model may submit its final answer without a new
# measurement before the phase stops early. Separate from the measurements
# without improvement.
max_final_answers_without_measurement = 10
# The rise in percentage points that counts as an improvement. Below a
# configured minimum score, any measured rise counts.
min_improvement_points = 0.5

# Go back to the best passing suite after this many passing measurements that
# scored lower than it. Equal scores do not count. Nonpositive values disable
# going back.
restore_count = 1
# Suite reduction: at a phase end, Testuary drops the tests that add no
# coverage and no mutant kill, keeping the fastest set. exact finds that set
# with PuLP's CBC solver and requires a proven optimum. greedy is a heuristic you can
# select instead.
reduction_solver = exact
# Time limit of the exact solver, in seconds, for all its steps together.
reduction_solver_time_limit_seconds = 120
# The smallest run time counted for one test in suite reduction, in
# milliseconds.
reduction_min_test_time_ms = 0.001
# The solver's seed (CBC), separate from the starter suites' seeds.
reduction_solver_random_seed = 1
# Among sets of tests with the optimal run time and test count: name_order
# counts exact duplicate tests once, prefers tests earlier in name order and
# proves the choice unique. solver keeps whichever optimal set CBC returns,
# which can differ between its builds.
reduction_tie_break = name_order
# Log progress every N model requests. Zero disables this heartbeat.
progress_heartbeat_requests = 25
# Extra measurements at the goal after the first one, repeated measurements not
# counted. Zero stops at the first. Below the goal the count pauses rather
# than resets.
extra_measurements_after_goal = 0
# Whether a repeated or rejected measurement counts as one without improvement.
count_repeated_measurements = false
# Let the loop stop once max_measurements_without_improvement is reached.
allow_early_stop = true
# Failing test runs in a row after which the suite is restored to its last
# passing version.
max_failed_test_attempts = 10

# Mutation phase settings. The loop edits the coverage phase's delivered suite.
[mutation]

# Mutation score goal in percent. The loop ends once it is reached (see
# extra_measurements_after_goal), but not while tests fail when run in
# reverse order (report_reverse_order_failures).
goal = 80
# A final mutation score below this is marked below its minimum in tests.csv.
# While the best score is below it, any rise counts as an improvement. Zero
# disables the minimum.
minimum = 65

# Extra measurements at the goal after the first one, repeated measurements not
# counted. Zero stops at the first. Below the goal the count pauses rather
# than resets.
extra_measurements_after_goal = 0

# Go back to the best passing suite after this many passing measurements that
# scored lower than it. Equal scores do not count. Nonpositive values disable
# going back.
restore_count = 1

# Measurements without improvement after which the loop stops. Nonpositive
# values disable this stop. A share such as 10% is that share of this phase's
# max_requests_per_phase, rounded up, and is refused while
# max_requests_per_phase is unlimited.
max_measurements_without_improvement = 10
# The rise in percentage points that counts as an improvement. Below a
# configured minimum score, any measured rise counts.
min_improvement_points = 0.5

# Let the loop stop once max_measurements_without_improvement is reached.
allow_early_stop = true

# Whether a repeated or rejected measurement counts as one without improvement.
count_repeated_measurements = false

# The most model requests this phase may send, a positive number or
# unlimited. A request whose answer is refused counts. Retries after a
# temporary failure count only with count_retries.
max_requests_per_phase = 1000
# The most input tokens all of this phase's requests may have together. Zero
# or unlimited disables this limit.
max_input_tokens_per_phase = 0
# The most output tokens all of this phase's responses may have together.
# Zero or unlimited disables this limit.
max_output_tokens_per_phase = 0
# The most input and output tokens together in this phase. Zero or unlimited
# disables this limit.
max_total_tokens_per_phase = 0
# The longest time this phase may take, in seconds. Zero or unlimited
# disables this limit.
max_wall_clock_seconds_per_phase = 0

# The mutation tool. The shipped default cosmic_ray runs the language's own
# tool: Cosmic Ray for Python, PIT for Java and Mull for C. The values pit, for
# Java, and mull, for C, select them by name. A tool the target's language does
# not offer fails when its first mutation measurement starts, with the default
# phase_end_mutation at the starter phase's measurement after generation. A
# run's records name the tool that ran.
engine = cosmic_ray
# local executes mutants sequentially. http uses worker clones and a worker
# pool. auto follows engine_workers: local for 1 worker, http for
# more. A Python run with local and more than one worker is refused before
# it starts. Neither distributor guarantees identical outcomes across resource
# conditions.
cosmic_ray_distributor = auto
# How many workers measure mutants at once: Cosmic Ray's HTTP workers, PIT's
# threads for Java and parallel mutant runs for C. Cosmic Ray's local
# distributor runs one. The count is part of a measurement's execution
# conditions.
engine_workers = 1
# Allow local execution if the configured HTTP pool cannot start. False
# preserves the failure instead of silently changing the distributor.
allow_sequential_fallback = false
# auto derives the timeout from the passing suite's run time, multiplied by the
# configured factor and bounded by min_per_mutant_timeout_seconds and
# max_per_mutant_timeout_factor times suite_run_timeout_seconds. For C the
# mutation tool times the passing suite itself, each test in a process of its
# own as a mutant's tests run, and applies this rule to that time. A positive
# integer selects a fixed per-mutant timeout instead. For C it bounds all of a
# mutant's tests together, and a mutant whose time ends between two of its
# tests is untested.
per_mutant_timeout_seconds = auto
# With auto: the per-mutant timeout is this many times the passing suite's
# run time, for C the mutation tool's own run.
per_mutant_timeout_factor = 10
# With auto: the shortest per-mutant timeout, in seconds.
min_per_mutant_timeout_seconds = 30
# With auto: the longest per-mutant timeout, as a factor of
# suite_run_timeout_seconds.
max_per_mutant_timeout_factor = 1.5
# The time limit of one mutation measurement, in seconds. A measurement that
# reaches it is incomplete: its untested mutants count as not
# killed, so its score is a lower bound.
measurement_timeout_seconds = 3600

# Interval for mutation progress observations, in seconds. Zero disables them.
cosmic_ray_progress_interval_s = 30

# Python (Cosmic Ray): the mutation operators. Empty selects the full
# catalogue. wong_mathur_selective selects the arithmetic, relational and
# logical operator families (AOR, ROR, LCR).
cosmic_ray_operators =
# Java (PIT): empty selects PIT's default mutators. A PIT group (STRONGER,
# ALL) or a comma list of mutator names selects others.
pit_mutators =
# Include each mutant's captured output in the persisted matrix.
cosmic_ray_keep_output = false
# For a suite of several test files: when a mutant's killing test cannot be
# named from the combined run, rerun the files one at a time to name it.
cosmic_ray_per_file_adjudication = true
# With loop_catalogue = selective: switch to the full catalogue once the
# selective score reaches selective_switch_threshold or stops improving.
full_after_selective_goal = false
# The score over the selective catalogue, in percent, at which that switch
# happens.
selective_switch_threshold = 85
# Which killing tests a phase end records: full records every killing
# test, first stops at the first one (fail-fast), which credits each kill to
# one test only. full gives suite reduction and the derived scores more
# choices. It is not a guarantee that new measurements have identical
# outcomes.
cover_attribution = full
# The operators the mutation phase measures with: full uses the full catalogue
# throughout. selective uses the selective catalogue cosmic_ray_operators
# (Python) or pit_mutators (Java) select.
loop_catalogue = full
# A directory for Cosmic Ray's session files. Empty uses a temporary directory
# the engine creates and removes. A directory named here stays yours and is not
# removed.
cosmic_ray_session_dir =
# Time limit for building the list of mutants, in seconds.
cosmic_ray_init_timeout_s = 1800
# Readiness timeout for each HTTP worker. Unavailable workers are excluded
# from the pool.
cosmic_ray_worker_ready_timeout_s = 60
# Enable INFO output from cosmic-ray exec and log its captured stderr tail.
cosmic_ray_verbose = false
# Directory of cached lists of mutants. auto resolves under the run directory.
# Empty disables caching. Cache reuse remains bound to its source and tool
# identity.
cosmic_ray_catalogue_cache_dir = auto
# The most cached lists of mutants. Zero keeps any number.
cosmic_ray_cache_max_entries = 200
# Maximum age of a cached list of mutants, in days. Zero keeps them
# regardless of age.
cosmic_ray_cache_max_age_days = 0
# The directory for each Cosmic Ray HTTP worker's copy of the project. auto
# chooses one as the cluster guide describes, and a path sets it.
cosmic_ray_clone_dir = auto
# Remove the worker copies a killed run left once they are older than this
# many hours. Zero turns the removal off. Set it well above the longest Cosmic
# Ray session, so that a session running at the same time keeps its copies.
cosmic_ray_clone_sweep_hours = 12
# The directory in which a session without cosmic_ray_session_dir gets its
# temporary directory, on this machine or, in container mode, in the
# container. It must be local, such as /dev/shm or a node's own disk: the
# session database fails on a network file system. Empty chooses one as the
# cluster guide describes.
cosmic_ray_local_session_dir =

# Wall-clock limit for a suite execution, in seconds.
suite_run_timeout_seconds = 600
# Suite timeouts in a row before the phase ends. A passing run resets the
# count.
# Nonpositive values disable this stop.
suite_timeout_stop_after = 10
# Count an otherwise passing run as failing when it warns of an asynchronous
# test that did not run properly, such as an unawaited coroutine.
reject_unsound_async_green = true
# After a passing test run, also run the file as delivered in reverse order,
# for a language that offers that order, and tell the model which tests fail
# there. The note decides no test's outcome, but while tests fail when run in
# reverse order, the loop does not end at its goal.
report_reverse_order_failures = false

# Finishing, the fourth phase: the delivered suite is measured, without model
# requests.
[finishing]


# Record the lint findings of the target and its tests (Ruff for Python).
measure_lint = false

# What tests.csv reports for the delivered suites of the starter and coverage
# phases (their own coverage and mutation columns), read from what those
# phases recorded: full reports coverage and mutation over the full catalogue,
# coverage omits mutation, off omits these columns. Nothing is measured again
# for them. The run's delivered suite is measured as usual.
phase_scores = full

# Wall-clock limit for a suite execution, in seconds.
suite_run_timeout_seconds = 600
# Coverage timeout for the delivered suite, in seconds.
coverage_timeout_seconds = 1800
# Measure the delivered suite's mutation score when enabled. Missing required
# suites or engines remain errors, not empty successful measurements. Off, the
# mutation minimum is not judged: no score of the delivered suite is measured.
measure_mutation = true

# Finishing can time the delivered suite, without instrumentation.
[timing]
# Time the delivered suite. Warmups are discarded and timed repetitions
# produce the reported median. The process-local lock does not prevent
# interference from other processes or machines.
measure = false
# Number of timed repetitions.
run_count = 5
# Discarded warmup repetitions before timing.
warmup_count = 1
# CPU IDs for container timing. Affinity does not reserve CPUs or remove
# contention.
cpuset =
# Time one suite at a time in this process. The
# TESTUARY_TIMING_SERIALIZE variable sets it, as for every setting: true or
# false (also yes or no, on or off, 1 or 0), in any letter case. Any other
# value, an empty one included, refuses the run.
serialize = true

# Limits on what the model sees. Each value is a positive integer or
# unlimited. A cut output carries a marker naming what was left out.
# The coverage phase's and the mutation phase's own limits override
# these, and the mutation phase takes the coverage phase's first. A models.ini
# alias or provider entry may set them for one model.
[limits]
# At most this many characters of any tool result, a third kept from its start
# and the rest from its end.
tool_result_chars = 160000
# At most this many characters of one read_source or read_tests call, which
# then names the next start line.
read_chars = 160000
# At most this many full failure tracebacks in a test run's output.
test_tracebacks = 3
# At most this many names of the failures whose tracebacks are left out.
test_failure_names = 8
# At most this many import and collection error lines shown first.
test_cause_lines = 8
# At most this many lines of pytest's warnings summary.
test_warning_lines = 12
# At most this many characters of test output with no recognized section, a
# third kept from its start.
test_fallback_chars = 1200
# At most this many Maven [ERROR] and [WARNING] lines shown first.
maven_error_lines = 12
# At most this many test names per group of equal failures.
failure_group_names = 4
# At most this many error lines of a collection failure.
collection_errors = 5
# At most this many tests named when a passing run is counted as failing for
# an asynchronous test warning (reject_unsound_async_green).
unsound_async_items = 10
# At most this many warnings quoted there when no test can be named.
unsound_async_warnings = 6
# At most this many characters of the end of a failing normal run's output before a
# mutation measurement.
failing_run_output_chars = 4000
# At most this many characters of the end of the output of a coverage run that
# collected no tests.
empty_run_output_chars = 2000
# At most this many tests named as suspects after a test run timed out.
timeout_suspects = 8
# At most this many lines of the reason a suite run failed, from its end.
run_reason_lines = 3
# At most this many names per kind in the note on a test that leaves shared
# state changed.
leak_names = 10
# At most this many surviving mutants shown with their change.
survivor_diffs = 10
# At most this many characters of the change of one surviving mutant.
survivor_diff_chars = 240
# At most this many characters of uncovered source shown inline after a
# coverage measurement.
uncovered_chars = 150000
# At most this many read_source calls suggested for uncovered code not shown.
uncovered_suggestions = 8
# At most this many branches not yet covered listed.
branch_arcs = 60
# At most this many characters of the source line of a branch destination.
branch_snippet_chars = 70
# At most this many characters of uncovered ranges in the state line of each
# model request.
state_marker_chars = 250
# At most this many lines of an inserted block echoed in full after an edit, a
# longer one keeping its first and last lines, six fewer in all.
edit_echo_lines = 30
# At most this many lines of old_text compared when an edit finds no match.
edit_evidence_lines = 5
# At most this many characters of each line of old_text compared when an edit
# finds no match.
edit_evidence_chars = 100
# At most this many edits in one edits list, a longer list refused without
# writing.
edit_list_items = unlimited
# At most this many changed regions shown in the result of one edits list.
edit_list_views = unlimited
# At most this many characters of the source quoted in a syntax error of an
# edit, from its start.
syntax_snippet_chars = 80
# At most this many characters of the last run_tests result in the state block
# of a retry prompt.
recovery_result_chars = 200
# At most this many characters of the validation error of a rejected final
# answer.
rejection_chars = 600
# At most this many characters of the parse error of a tool call whose
# arguments are not valid JSON.
malformed_args_chars = 200
# At most this many earlier messages kept when the context is rebuilt,
# without a marker.
history_messages = 30

# What the coverage phase's model is shown, over [limits].
[limits_coverage]

# What the mutation phase's model is shown, over [limits] and
# [limits_coverage].
[limits_mutation]

# The offline demonstration (testuary --demo).
[demo]
# Length of a paced playback in seconds, at --demo-speed 1. The
# demonstrations guide describes how a playback uses it and what else sets it.
playback_seconds = 120

# The browser interface, testuary-web. These settings configure no run, so
# a run's records leave them out.
[web]
# The port on 127.0.0.1 the interface listens on. 0 takes a free one. The
# web interface guide describes it with the --port option.
port = 8765
# Who may use the interface: open, key or stable_key. The web interface
# guide's section Access says what each one allows.
access = open
