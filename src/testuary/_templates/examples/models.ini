# A model alias served through the example's client factory, the file
# testuary_example_chat.py beside this file. It needs no installation.
# Set LOCAL_MODEL_API_KEY before running, even for a local endpoint that
# accepts any key. Keep keys out of files.

[example_added]
provider = openai
model = qwen3-coder:latest
api_url = http://localhost:11434/v1
api_key_env = LOCAL_MODEL_API_KEY
chat_model = testuary_example_chat.py:factory
protocol = added
