# Model catalogue in your Testuary user directory, where testuary init copies
# it and testuary setup model writes it. Testuary reads that copy, not this
# bundled template.
# The examples show the format and recommend no model.
#
# Section names are model aliases, chosen freely. Every alias states its
# provider: ollama, openai, vllm, or a provider section of its own in this
# file (with its api_url). The api_key lives here, in a bare [<provider>]
# section for the whole provider or as a per-model api_key that overrides it,
# or in a TESTUARY_<PROVIDER>_API_KEY environment variable. Keep this file
# out of version control.
#
# The model alias only needs to override what differs from the provider
# defaults.
#
# Per-model fields use provider and loader defaults when omitted:
#
#   provider           Required: ollama, openai, vllm or a provider section.
#   model              Public API model name sent in the request body.
#                      Defaults to the section name when omitted.
#   api_url            Base URL for this alias. Defaults to the provider's
#                      api_url from config.ini. Set an alias-specific URL
#                      when the model uses a different endpoint.
#   api_key_env        The environment variable that holds the key, when it
#                      is not TESTUARY_<PROVIDER>_API_KEY. The run is refused
#                      while that variable is unset or empty, even when this
#                      file also sets an api_key. When it is set, an api_key
#                      in this file takes precedence over it.
#   max_output_tokens  The most tokens one model response may have. When the
#                      phase also sets a positive limit, the smaller one
#                      applies.
#                      Configure it for the declared model and experiment.
#   temperature, top_p Sampling controls; zero is sent, empty omits the field.
#                      seed is refused here: set it per phase in config.ini.
#   request_timeout_seconds
#                      Positive model-request timeout, separate from suite runs.
#   protocol           openai-chat, openai-responses, ollama-native or added.
#                      Native Ollama is supported only for initial generation.
#   reasoning          on/off, or empty for the provider's default.
#   reasoning_effort   Provider effort level, when the protocol supports it.
#   reasoning_budget_tokens
#                      Positive budget, when supported. Empty omits the field;
#                      use reasoning = off rather than a zero budget.
#   reasoning_dialect  deepseek, vllm, openrouter or openai for openai-chat.
#   reasoning_template For the vllm dialect: the chat-template keys the served
#                      model reads. qwen: enable_thinking (the hybrid Qwen3
#                      models, such as Qwen3-8B). deepseek_v3: thinking (DeepSeek
#                      V3.1, V3.2-Exp). deepseek: thinking and reasoning_effort
#                      high or max (DeepSeek V4). deepseek_v4_1: enable_thinking and
#                      reasoning_effort low, medium, high, max or 1 to 100
#                      (DeepSeek V4.1). Defaults from the model name for those
#                      models. Other templates, such as QwQ's and DeepSeek-R1's,
#                      ignore these keys. Declare it when the server uses
#                      another template than the model's own.
#                      Unsupported controls are refused, not silently dropped.
#   request_options    JSON object of additional provider request-body fields.
#                      It cannot override first-class controls or credentials.
#   chat_model         An added LangChain-compatible factory as item:attribute,
#                      the item a Python file or a module name, such as
#                      my_chat.py:GatewayChat. A file is relative to the
#                      directory of the file that names it.
#
# The examples below are comments. To use an example, remove the # before
# its section and settings, and give the example your model and address.

# ---------- OpenAI-compatible (public or custom endpoint) ----------
# [openai_gpt_4o]
# provider = openai
# model = gpt-4o

# A private or self-hosted OpenAI-compatible endpoint: set api_url on the
# alias to point at any base URL. The api_key still resolves from a bare
# [openai] section here, a per-alias api_key, or TESTUARY_OPENAI_API_KEY.
# [gateway_example]
# provider = openai
# model = your-served-model
# api_url = https://your-gateway.example.com/v1

# ---------- Ollama Cloud ----------
# [ollama_qwen3_coder_next]
# provider = ollama
# model = qwen3-coder-next:cloud

# ---------- Local vLLM ----------
# [vllm_qwen3_coder_next]
# provider = vllm
# model = qwen3-coder-next

# [vllm_granite_4_1_30b]
# provider = vllm
# model = ibm-granite/granite-4.1-30b-instruct
# Example output cap. It does not establish the model's input context limit.
# max_output_tokens = 49152
